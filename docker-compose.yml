name: infra-monitoring-dashboard

x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-infra}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-infra_monitoring}
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:-dev-secret}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  AI_ANALYSIS_ENABLED: ${AI_ANALYSIS_ENABLED:-true}
  METRIC_RETENTION_DAYS: ${METRIC_RETENTION_DAYS:-90}
  SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-UTC}

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-infra_monitoring}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infra} -d ${POSTGRES_DB:-infra_monitoring}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend-env
    command: >
      sh -c "flask db upgrade &&
             gunicorn 'app.main:create_app()'
               --bind 0.0.0.0:5000
               --workers ${GUNICORN_WORKERS:-4}
               --threads ${GUNICORN_THREADS:-2}
               --worker-class gthread
               --worker-tmp-dir /dev/shm
               --timeout 30
               --keep-alive 5
               --log-level ${LOG_LEVEL:-info}
               --access-logfile -"
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend-env
    command: python -m app.workers.scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
